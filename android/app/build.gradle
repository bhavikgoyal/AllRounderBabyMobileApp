def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFileName = keystoreProperties.getProperty("MYAPP_RELEASE_STORE_FILE")
def releaseStoreFile = releaseStoreFileName ? rootProject.file(releaseStoreFileName) : null
if (releaseStoreFile && !releaseStoreFile.exists()) {
    // Backward compatibility if the file was placed under android/app.
    def appRelativeStoreFile = file(releaseStoreFileName)
    if (appRelativeStoreFile.exists()) {
        releaseStoreFile = appRelativeStoreFile
    }
}
def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    namespace "com.allrounderbaby.app"

    defaultConfig {
        applicationId "com.allrounderbaby.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0.6"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile releaseStoreFile
                storePassword keystoreProperties.getProperty("MYAPP_RELEASE_STORE_PASSWORD")
                keyAlias keystoreProperties.getProperty("MYAPP_RELEASE_KEY_ALIAS")
                keyPassword keystoreProperties.getProperty("MYAPP_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Allows local release builds when private keystore is not in the repo.
                signingConfig signingConfigs.debug
                println("[signing] Release keystore not found. Using debug signing for local build.")
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-android"

    if (hermesEnabled.toBoolean()) {
        implementation "com.facebook.react:hermes-android"
    } else {
        implementation jscFlavor
    }
}