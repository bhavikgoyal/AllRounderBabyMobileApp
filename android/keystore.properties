org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Reduce parallelism and aggressive caching on Windows to avoid file-locks
# These settings improve stability on Windows machines where antivirus or
# file system locking causes "process is still writing to target directory" errors.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
org.gradle.daemon=true

# Media3 version used across the project. Override if needed.
MEDIA3_VERSION=1.8.0

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Architectures to build
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New architecture support
newArchEnabled=false

# Hermes JS engine
hermesEnabled=true

# Metadata aur API 36 errors ko rokne ke liye
android.suppressUnsupportedCompileSdk=36

# Kotlin version conflicts aur K2 compiler errors ke liye
kotlin.code.style=official
kotlin.incremental=false
kotlin.daemon.jvm.options=-Xmx2048m

# Purani libraries aur naye AndroidX ke beech compatibility ke liye
android.enableJetifier=true
android.useAndroidX=true

